trigger:
  branches:
    include:
      - main

  paths:
    include:
      - server.js
      - package.json
      - package-lock.json
      - routes/**
      - models/**
      - views/**
      - public/**
      - config/**
      - db/**
      - ansible/**
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main

variables:
  - group: Epicbook-mysql-secrets


# ============================================================
# STAGE 1: PREPARE
# ============================================================

stages:

- stage: Prepare
  displayName: "1. Prepare"

  jobs:

  - job: PrepareEnvironment
    displayName: "Prepare Ansible Environment"

    pool:
      name: "epicbook-agent-pool"

    steps:

    # --------------------------------------------------------
    # Checkout repository
    # --------------------------------------------------------
    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Install Python tooling
    # --------------------------------------------------------
    - bash: |
        set -e

        echo "Installing Python tooling..."

        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv

        echo "Python version:"
        python3 --version

        echo "pip version:"
        python3 -m pip --version

      displayName: "Install Python Tooling"


    # --------------------------------------------------------
    # Create isolated Ansible environment
    # --------------------------------------------------------
    - bash: |
        set -e

        VENV_PATH="$(Agent.TempDirectory)/epicbook-ansible-venv"

        rm -rf "$VENV_PATH"

        python3 -m venv "$VENV_PATH"

        "$VENV_PATH/bin/python" -m pip install --upgrade pip
        "$VENV_PATH/bin/pip" install ansible

        echo "Installed Ansible:"
        "$VENV_PATH/bin/ansible" --version

        echo "##vso[task.setvariable variable=ANSIBLE_VENV]$VENV_PATH"

      displayName: "Install Ansible"


    # --------------------------------------------------------
    # Install MySQL Ansible collection
    # --------------------------------------------------------
    - bash: |
        set -e

        "$ANSIBLE_VENV/bin/ansible-galaxy" \
          collection install community.mysql

      displayName: "Install Ansible MySQL Collection"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)


    # --------------------------------------------------------
    # Download SSH private key
    # --------------------------------------------------------
    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download Secure SSH Key"

      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Prepare SSH key
    # --------------------------------------------------------
    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

        chmod 600 "$SSH_KEY_PATH"

        echo "SSH key prepared successfully."

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"

      displayName: "Prepare Secure SSH Key"



# ============================================================
# STAGE 2: VALIDATE
# ============================================================

- stage: Validate
  displayName: "2. Validate"

  dependsOn: Prepare

  condition: succeeded()

  jobs:

  - job: ValidateAnsible
    displayName: "Validate Ansible Configuration"

    pool:
      name: "epicbook-agent-pool"

    steps:

    # --------------------------------------------------------
    # Checkout repository
    # --------------------------------------------------------
    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Install Python tooling
    # --------------------------------------------------------
    - bash: |
        set -e

        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv

      displayName: "Install Python Tooling"


    # --------------------------------------------------------
    # Create Ansible virtual environment
    # --------------------------------------------------------
    - bash: |
        set -e

        VENV_PATH="$(Agent.TempDirectory)/epicbook-ansible-venv"

        rm -rf "$VENV_PATH"

        python3 -m venv "$VENV_PATH"

        "$VENV_PATH/bin/python" -m pip install --upgrade pip
        "$VENV_PATH/bin/pip" install ansible

        "$VENV_PATH/bin/ansible" --version

        echo "##vso[task.setvariable variable=ANSIBLE_VENV]$VENV_PATH"

      displayName: "Install Ansible"


    # --------------------------------------------------------
    # Install MySQL collection
    # --------------------------------------------------------
    - bash: |
        set -e

        "$ANSIBLE_VENV/bin/ansible-galaxy" \
          collection install community.mysql

      displayName: "Install Ansible MySQL Collection"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)


    # --------------------------------------------------------
    # Validate inventory
    # --------------------------------------------------------
    - bash: |
        set -e

        echo "Validating Ansible inventory..."

        "$ANSIBLE_VENV/bin/ansible-inventory" \
          -i ansible/inventory.ini \
          --list \
          > "$(Agent.TempDirectory)/ansible-inventory.json"

        echo "Ansible inventory is valid."

      displayName: "Validate Ansible Inventory"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)


    # --------------------------------------------------------
    # Validate playbook syntax
    # --------------------------------------------------------
    - bash: |
        set -e

        "$ANSIBLE_VENV/bin/ansible-playbook" \
          ansible/site.yml \
          -i ansible/inventory.ini \
          --syntax-check

        echo "Ansible syntax validation passed."

      displayName: "Ansible Syntax Check"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)


    # --------------------------------------------------------
    # Download SSH private key
    # --------------------------------------------------------
    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download Secure SSH Key"

      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Prepare SSH key
    # --------------------------------------------------------
    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

        chmod 600 "$SSH_KEY_PATH"

        echo "SSH key prepared successfully."

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"

      displayName: "Prepare Secure SSH Key"


    # --------------------------------------------------------
    # Create temporary SSH configuration
    #
    # Frontend:
    #   Direct connection
    #
    # Backend:
    #   Connection through frontend
    # --------------------------------------------------------
    - bash: |
        set -e

        SSH_CONFIG="$(Agent.TempDirectory)/epicbook_ssh_config"

        cat > "$SSH_CONFIG" <<EOF
        Host 34.237.145.113
          HostName 34.237.145.113
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null

        Host 10.0.2.157
          HostName 10.0.2.157
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          ProxyJump ubuntu@34.237.145.113
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

        chmod 600 "$SSH_CONFIG"

        echo "SSH configuration created."

        echo "##vso[task.setvariable variable=SSH_CONFIG]$SSH_CONFIG"

      displayName: "Configure SSH Jump Host"

      env:
        SSH_KEY_PATH: $(SSH_KEY_PATH)


    # --------------------------------------------------------
    # Test SSH connectivity
    # --------------------------------------------------------
    - bash: |
        set -e

        echo "Testing SSH connectivity to all Ansible hosts..."

        "$ANSIBLE_VENV/bin/ansible" \
          -i ansible/inventory.ini \
          all \
          -m ping \
          --private-key "$SSH_KEY_PATH" \
          --ssh-common-args="-F $SSH_CONFIG"

        echo "SSH connectivity test completed successfully."

      displayName: "Test SSH Connectivity"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)
        SSH_KEY_PATH: $(SSH_KEY_PATH)
        SSH_CONFIG: $(SSH_CONFIG)

        ANSIBLE_HOST_KEY_CHECKING: "False"



# ============================================================
# STAGE 3: CONFIGURE AND DEPLOY
# ============================================================

- stage: ConfigureAndDeploy
  displayName: "3. Configure and Deploy"

  dependsOn: Validate

  condition: succeeded()

  jobs:

  - job: DeployEpicBook
    displayName: "Configure Servers and Deploy EpicBook"

    pool:
      name: "epicbook-agent-pool"

    steps:

    # --------------------------------------------------------
    # Checkout repository
    # --------------------------------------------------------
    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Install Python tooling
    # --------------------------------------------------------
    - bash: |
        set -e

        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv

      displayName: "Install Python Tooling"


    # --------------------------------------------------------
    # Create Ansible virtual environment
    # --------------------------------------------------------
    - bash: |
        set -e

        VENV_PATH="$(Agent.TempDirectory)/epicbook-ansible-venv"

        rm -rf "$VENV_PATH"

        python3 -m venv "$VENV_PATH"

        "$VENV_PATH/bin/python" -m pip install --upgrade pip
        "$VENV_PATH/bin/pip" install ansible

        "$VENV_PATH/bin/ansible" --version

        echo "##vso[task.setvariable variable=ANSIBLE_VENV]$VENV_PATH"

      displayName: "Install Ansible"


    # --------------------------------------------------------
    # Install MySQL collection
    # --------------------------------------------------------
    - bash: |
        set -e

        "$ANSIBLE_VENV/bin/ansible-galaxy" \
          collection install community.mysql

      displayName: "Install Ansible MySQL Collection"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)


    # --------------------------------------------------------
    # Download SSH private key
    # --------------------------------------------------------
    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download Secure SSH Key"

      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Prepare SSH key
    # --------------------------------------------------------
    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

        chmod 600 "$SSH_KEY_PATH"

        echo "SSH key prepared successfully."

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"

      displayName: "Prepare Secure SSH Key"


    # --------------------------------------------------------
    # Configure SSH jump host
    # --------------------------------------------------------
    - bash: |
        set -e

        SSH_CONFIG="$(Agent.TempDirectory)/epicbook_ssh_config"

        cat > "$SSH_CONFIG" <<EOF
        Host 34.237.145.113
          HostName 34.237.145.113
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null

        Host 10.0.2.157
          HostName 10.0.2.157
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          ProxyJump ubuntu@34.237.145.113
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

        chmod 600 "$SSH_CONFIG"

        echo "SSH jump-host configuration prepared."

        echo "##vso[task.setvariable variable=SSH_CONFIG]$SSH_CONFIG"

      displayName: "Configure SSH Jump Host"

      env:
        SSH_KEY_PATH: $(SSH_KEY_PATH)


    # --------------------------------------------------------
    # Deploy EpicBook
    # --------------------------------------------------------
    - bash: |
        set -e

        echo "Starting EpicBook deployment..."

        "$ANSIBLE_VENV/bin/ansible-playbook" \
          -i ansible/inventory.ini \
          ansible/site.yml \
          --private-key "$SSH_KEY_PATH" \
          --ssh-common-args="-F $SSH_CONFIG" \
          -e "db_admin_username=$DB_ADMIN_USERNAME" \
          -e "db_admin_password=$DB_ADMIN_PASSWORD"

        echo "EpicBook deployment completed successfully."

      displayName: "Deploy EpicBook with Ansible"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)
        SSH_KEY_PATH: $(SSH_KEY_PATH)
        SSH_CONFIG: $(SSH_CONFIG)

        DB_ADMIN_USERNAME: $(mysqlAdminUsername)
        DB_ADMIN_PASSWORD: $(mysqlAdminPassword)

        ANSIBLE_HOST_KEY_CHECKING: "False"



# ============================================================
# STAGE 4: VERIFY
# ============================================================

- stage: Verify
  displayName: "4. Verify"

  dependsOn: ConfigureAndDeploy

  condition: succeeded()

  jobs:

  - job: VerifyDeployment
    displayName: "Verify EpicBook Deployment"

    pool:
      name: "epicbook-agent-pool"

    steps:

    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Deployment verification
    # --------------------------------------------------------
    - bash: |
        set -e

        echo ""
        echo "=================================================="
        echo "       EPICBOOK DEPLOYMENT VERIFICATION"
        echo "=================================================="
        echo ""

        echo "Prepare stage: SUCCESS"
        echo "Validation stage: SUCCESS"
        echo "Configure and Deploy stage: SUCCESS"
        echo "Ansible deployment command: SUCCESS"
        echo "Ansible exit code: 0"
        echo "Unreachable hosts: 0"
        echo "Failed hosts: 0"

        echo ""
        echo "Frontend:"
        echo "http://34.237.145.113"

        echo ""
        echo "Backend:"
        echo "10.0.2.157 (private)"

        echo ""
        echo "=================================================="
        echo "EpicBook deployment verification completed."
        echo "=================================================="

      displayName: "Verify Deployment Result"