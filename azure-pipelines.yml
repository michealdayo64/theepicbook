trigger:
  branches:
    include:
      - main

  paths:
    include:
      - routes/**
      - models/**
      - views/**
      - public/**
      - config/**
      - db/**
      - ansible/**
      - server.js
      - package.json
      - package-lock.json
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main

pool:
  name: "epicbook-agent-pool"

variables:
  - group: "Epicbook-mysql-secrets"

  - name: ANSIBLE_VENV
    value: "$(Agent.TempDirectory)/epicbook-ansible-venv"

  - name: ANSIBLE_HOST_KEY_CHECKING
    value: "False"


# ============================================================
# STAGE 1 - PREPARE
# ============================================================

stages:

- stage: Prepare
  displayName: "1. Prepare"

  jobs:
  - job: PrepareEnvironment
    displayName: "Prepare Ansible Environment"

    steps:

    - checkout: self
      displayName: "Checkout Repository"

    - bash: |
        set -e

        sudo apt-get update

        sudo apt-get install -y \
          python3-pip \
          python3-venv \
          openssh-client \
          rsync \
          netcat-openbsd

        rm -rf "$(ANSIBLE_VENV)"

        python3 -m venv "$(ANSIBLE_VENV)"

        "$(ANSIBLE_VENV)/bin/python" -m pip install --upgrade pip

        "$(ANSIBLE_VENV)/bin/pip" install ansible

        "$(ANSIBLE_VENV)/bin/ansible-galaxy" \
          collection install community.mysql ansible.posix community.general

        echo "Ansible version:"
        "$(ANSIBLE_VENV)/bin/ansible" --version

      displayName: "Prepare Ansible Environment"


# ============================================================
# STAGE 2 - VALIDATE
# ============================================================

- stage: Validate
  displayName: "2. Validate"

  dependsOn: Prepare

  jobs:
  - job: ValidateConfiguration
    displayName: "Validate Ansible and Network"

    steps:

    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Prepare Ansible
    # --------------------------------------------------------

    - bash: |
        set -e

        sudo apt-get update

        sudo apt-get install -y \
          python3-pip \
          python3-venv \
          openssh-client \
          rsync \
          netcat-openbsd

        rm -rf "$(ANSIBLE_VENV)"

        python3 -m venv "$(ANSIBLE_VENV)"

        "$(ANSIBLE_VENV)/bin/python" -m pip install --upgrade pip

        "$(ANSIBLE_VENV)/bin/pip" install ansible

        "$(ANSIBLE_VENV)/bin/ansible-galaxy" \
          collection install community.mysql ansible.posix community.general

      displayName: "Prepare Validation Environment"


    # --------------------------------------------------------
    # Validate inventory
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Validating Ansible inventory..."

        "$(ANSIBLE_VENV)/bin/ansible-inventory" \
          -i ansible/inventory.ini \
          --list

      displayName: "Validate Ansible Inventory"


    # --------------------------------------------------------
    # Validate playbook
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Checking Ansible playbook syntax..."

        "$(ANSIBLE_VENV)/bin/ansible-playbook" \
          -i ansible/inventory.ini \
          ansible/site.yml \
          --syntax-check

      displayName: "Ansible Syntax Check"


    # --------------------------------------------------------
    # Download SSH key
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download SSH Private Key"
      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Create SSH configuration
    # --------------------------------------------------------

    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

        chmod 600 "$SSH_KEY_PATH"

        SSH_CONFIG="$(Agent.TempDirectory)/epicbook_ssh_config"

        cat > "$SSH_CONFIG" <<EOF
        Host epicbook-frontend
            HostName 100.59.18.41
            User ubuntu
            IdentityFile $SSH_KEY_PATH
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 15

        Host epicbook-backend
            HostName 10.0.2.157
            User ubuntu
            IdentityFile $SSH_KEY_PATH
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 15
            ProxyCommand ssh -i $SSH_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -W %h:%p ubuntu@100.59.18.41
        EOF

        chmod 600 "$SSH_CONFIG"

        echo "SSH configuration created."

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"
        echo "##vso[task.setvariable variable=SSH_CONFIG]$SSH_CONFIG"

      displayName: "Configure SSH"


    # ========================================================
    # NETWORK DIAGNOSTICS
    # ========================================================

    # --------------------------------------------------------
    # TEST 1
    # Agent -> Frontend
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "=========================================="
        echo "TEST 1: Azure DevOps Agent -> Frontend"
        echo "=========================================="

        ssh \
          -i "$(SSH_KEY_PATH)" \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=15 \
          ubuntu@100.59.18.41 \
          "echo 'DIRECT FRONTEND SSH: SUCCESS'"

      displayName: "Test Agent to Frontend SSH"

      env:
        SSH_KEY_PATH: $(SSH_KEY_PATH)


    # --------------------------------------------------------
    # TEST 2
    # Frontend -> Backend TCP 22
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "=========================================="
        echo "TEST 2: Frontend -> Backend TCP 22"
        echo "=========================================="

        ssh \
          -i "$(SSH_KEY_PATH)" \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=15 \
          ubuntu@100.59.18.41 \
          "nc -vz -w 10 10.0.2.157 22"

      displayName: "Test Frontend to Backend SSH Port"

      env:
        SSH_KEY_PATH: $(SSH_KEY_PATH)


    # --------------------------------------------------------
    # TEST 3
    # Frontend -> Backend TCP 3000
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "=========================================="
        echo "TEST 3: Frontend -> Backend TCP 3000"
        echo "=========================================="

        ssh \
          -i "$(SSH_KEY_PATH)" \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=15 \
          ubuntu@100.59.18.41 \
          "nc -vz -w 10 10.0.2.157 3000"

      displayName: "Test Frontend to Backend Application Port"

      env:
        SSH_KEY_PATH: $(SSH_KEY_PATH)


    # --------------------------------------------------------
    # TEST 4
    # Agent -> Backend through Frontend
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "=========================================="
        echo "TEST 4: Agent -> Backend through Frontend"
        echo "=========================================="

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-backend \
          "echo 'BACKEND SSH THROUGH FRONTEND: SUCCESS'"

      displayName: "Test Backend SSH Through Frontend"

      env:
        SSH_CONFIG: $(SSH_CONFIG)


    # --------------------------------------------------------
    # TEST 5
    # Ansible -> all hosts
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "=========================================="
        echo "TEST 5: Ansible connectivity"
        echo "=========================================="

        "$(ANSIBLE_VENV)/bin/ansible" \
          -i ansible/inventory.ini \
          all \
          -m ping \
          --private-key "$(SSH_KEY_PATH)" \
          --ssh-common-args="-F $(SSH_CONFIG)"

      displayName: "Test Ansible Connectivity"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)
        SSH_KEY_PATH: $(SSH_KEY_PATH)
        SSH_CONFIG: $(SSH_CONFIG)
        ANSIBLE_HOST_KEY_CHECKING: "False"


# ============================================================
# STAGE 3 - CONFIGURE AND DEPLOY
# ============================================================

- stage: ConfigureAndDeploy
  displayName: "3. Configure and Deploy"

  dependsOn: Validate

  jobs:
  - job: DeployEpicBook
    displayName: "Configure Servers and Deploy EpicBook"

    steps:

    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Prepare environment
    # --------------------------------------------------------

    - bash: |
        set -e

        sudo apt-get update

        sudo apt-get install -y \
          python3-pip \
          python3-venv \
          openssh-client \
          rsync

        rm -rf "$(ANSIBLE_VENV)"

        python3 -m venv "$(ANSIBLE_VENV)"

        "$(ANSIBLE_VENV)/bin/python" -m pip install --upgrade pip

        "$(ANSIBLE_VENV)/bin/pip" install ansible

        "$(ANSIBLE_VENV)/bin/ansible-galaxy" \
          collection install community.mysql ansible.posix community.general

      displayName: "Prepare Deployment Environment"


    # --------------------------------------------------------
    # Download SSH key
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download SSH Private Key"
      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Configure SSH jump
    # --------------------------------------------------------

    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

        chmod 600 "$SSH_KEY_PATH"

        SSH_CONFIG="$(Agent.TempDirectory)/epicbook_ssh_config"

        cat > "$SSH_CONFIG" <<EOF
        Host epicbook-frontend
            HostName 100.59.18.41
            User ubuntu
            IdentityFile $SSH_KEY_PATH
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 15

        Host epicbook-backend
            HostName 10.0.2.157
            User ubuntu
            IdentityFile $SSH_KEY_PATH
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 15
            ProxyCommand ssh -i $SSH_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -W %h:%p ubuntu@100.59.18.41
        EOF

        chmod 600 "$SSH_CONFIG"

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"
        echo "##vso[task.setvariable variable=SSH_CONFIG]$SSH_CONFIG"

      displayName: "Configure SSH Jump Host"


    # --------------------------------------------------------
    # Verify both SSH paths
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Testing frontend SSH..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-frontend \
          "echo 'Frontend SSH: SUCCESS'"

        echo "Testing backend SSH through frontend..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-backend \
          "echo 'Backend SSH through frontend: SUCCESS'"

      displayName: "Verify SSH Connectivity"

      env:
        SSH_CONFIG: $(SSH_CONFIG)


    # --------------------------------------------------------
    # Run Ansible
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Starting EpicBook deployment..."

        "$(ANSIBLE_VENV)/bin/ansible-playbook" \
          -i ansible/inventory.ini \
          ansible/site.yml \
          --private-key "$(SSH_KEY_PATH)" \
          --ssh-common-args="-F $(SSH_CONFIG)" \
          -e "db_admin_username=$(mysqlAdminUsername)" \
          -e "db_admin_password=$(mysqlAdminPassword)" \
          -e "ssh_config_path=$(SSH_CONFIG)"

      displayName: "Run Ansible Deployment"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)
        SSH_KEY_PATH: $(SSH_KEY_PATH)
        SSH_CONFIG: $(SSH_CONFIG)
        ANSIBLE_HOST_KEY_CHECKING: "False"
        mysqlAdminUsername: $(mysqlAdminUsername)
        mysqlAdminPassword: $(mysqlAdminPassword)


# ============================================================
# STAGE 4 - VERIFY
# ============================================================

- stage: Verify
  displayName: "4. Verify"

  dependsOn: ConfigureAndDeploy

  condition: succeeded()

  jobs:
  - job: VerifyDeployment
    displayName: "Verify EpicBook Deployment"

    steps:

    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Download key
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download SSH Private Key"
      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Configure SSH
    # --------------------------------------------------------

    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

        chmod 600 "$SSH_KEY_PATH"

        SSH_CONFIG="$(Agent.TempDirectory)/epicbook_ssh_config"

        cat > "$SSH_CONFIG" <<EOF
        Host epicbook-frontend
            HostName 100.59.18.41
            User ubuntu
            IdentityFile $SSH_KEY_PATH
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 15

        Host epicbook-backend
            HostName 10.0.2.157
            User ubuntu
            IdentityFile $SSH_KEY_PATH
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 15
            ProxyCommand ssh -i $SSH_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -W %h:%p ubuntu@100.59.18.41
        EOF

        chmod 600 "$SSH_CONFIG"

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"
        echo "##vso[task.setvariable variable=SSH_CONFIG]$SSH_CONFIG"

      displayName: "Configure Verification SSH"


    # --------------------------------------------------------
    # Verify frontend
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Checking frontend..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-frontend \
          "hostname"

      displayName: "Verify Frontend"

      env:
        SSH_CONFIG: $(SSH_CONFIG)


    # --------------------------------------------------------
    # Verify backend
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Checking backend..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-backend \
          "hostname"

      displayName: "Verify Backend"

      env:
        SSH_CONFIG: $(SSH_CONFIG)


    # --------------------------------------------------------
    # Verify backend application
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Checking backend application..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-backend \
          "curl -fsS http://127.0.0.1:3000 || exit 1"

      displayName: "Verify Backend Application"

      env:
        SSH_CONFIG: $(SSH_CONFIG)


    # --------------------------------------------------------
    # Verify public EpicBook endpoint
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Checking public EpicBook endpoint..."

        HTTP_STATUS=$(curl \
          -s \
          -o /dev/null \
          -w "%{http_code}" \
          --connect-timeout 10 \
          http://100.59.18.41)

        echo "EpicBook HTTP status: $HTTP_STATUS"

        if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
          echo "EpicBook endpoint is reachable."
        else
          echo "EpicBook endpoint verification failed."
          exit 1
        fi

      displayName: "Verify Public EpicBook Endpoint"