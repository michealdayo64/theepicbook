trigger:
  branches:
    include:
      - main
  paths:
    include:
      - server.js
      - package.json
      - package-lock.json
      - routes/**
      - models/**
      - views/**
      - public/**
      - config/**
      - db/**
      - ansible/**
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main

variables:
  - group: Epicbook-mysql-secrets

stages:

# ============================================================
# STAGE 1: PREPARE
# ============================================================
- stage: Prepare
  displayName: "1. Prepare"
  jobs:

    - job: PrepareEnvironment
      displayName: "Prepare Ansible Environment"

      pool:
        name: "epicbook-agent-pool"

      steps:

        - checkout: self
          displayName: "Checkout Repository"

        # ----------------------------------------------------
        # Install Python tooling
        # ----------------------------------------------------
        - bash: |
            set -e

            echo "Installing Python pip and virtual environment support..."

            sudo apt-get update
            sudo apt-get install -y python3-pip python3-venv

            echo "Python version:"
            python3 --version

            echo "pip version:"
            python3 -m pip --version

          displayName: "Install Python Tooling"

        # ----------------------------------------------------
        # Create isolated Ansible virtual environment
        # ----------------------------------------------------
        - bash: |
            set -e

            VENV_PATH="$(Agent.TempDirectory)/epicbook-ansible-venv"

            rm -rf "$VENV_PATH"

            python3 -m venv "$VENV_PATH"

            "$VENV_PATH/bin/python" -m pip install --upgrade pip
            "$VENV_PATH/bin/pip" install ansible

            echo "Ansible version:"
            "$VENV_PATH/bin/ansible" --version

            echo "##vso[task.setvariable variable=ANSIBLE_VENV]$VENV_PATH"

          displayName: "Install Ansible"

        # ----------------------------------------------------
        # Install MySQL Ansible collection
        # ----------------------------------------------------
        - bash: |
            set -e

            "$ANSIBLE_VENV/bin/ansible-galaxy" collection install community.mysql

          displayName: "Install Ansible MySQL Collection"
          env:
            ANSIBLE_VENV: $(ANSIBLE_VENV)

        # ----------------------------------------------------
        # Download SSH private key
        # ----------------------------------------------------
        - task: DownloadSecureFile@1
          name: downloadSSHKey
          displayName: "Download Secure SSH Key"
          inputs:
            secureFile: "id_ed25519"

        # ----------------------------------------------------
        # Prepare SSH key
        #
        # IMPORTANT:
        # DownloadSecureFile already places the file in
        # Agent.TempDirectory. Do NOT copy it again.
        # ----------------------------------------------------
        - bash: |
            set -e

            SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

            chmod 600 "$SSH_KEY_PATH"

            echo "SSH key prepared successfully."

            echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"

          displayName: "Prepare Secure SSH Key"


# ============================================================
# STAGE 2: VALIDATE
# ============================================================
- stage: Validate
  displayName: "2. Validate"

  dependsOn: Prepare

  condition: succeeded()

  jobs:

    - job: ValidateAnsible
      displayName: "Validate Ansible Configuration"

      pool:
        name: "epicbook-agent-pool"

      steps:

        - checkout: self
          displayName: "Checkout Repository"

        # ----------------------------------------------------
        # Install Python tooling
        # ----------------------------------------------------
        - bash: |
            set -e

            sudo apt-get update
            sudo apt-get install -y python3-pip python3-venv

          displayName: "Install Python Tooling"

        # ----------------------------------------------------
        # Create Ansible virtual environment
        # ----------------------------------------------------
        - bash: |
            set -e

            VENV_PATH="$(Agent.TempDirectory)/epicbook-ansible-venv"

            rm -rf "$VENV_PATH"

            python3 -m venv "$VENV_PATH"

            "$VENV_PATH/bin/python" -m pip install --upgrade pip
            "$VENV_PATH/bin/pip" install ansible

            "$VENV_PATH/bin/ansible" --version

            echo "##vso[task.setvariable variable=ANSIBLE_VENV]$VENV_PATH"

          displayName: "Install Ansible"

        # ----------------------------------------------------
        # Install Ansible collections
        # ----------------------------------------------------
        - bash: |
            set -e

            "$ANSIBLE_VENV/bin/ansible-galaxy" \
              collection install community.mysql

          displayName: "Install Ansible MySQL Collection"
          env:
            ANSIBLE_VENV: $(ANSIBLE_VENV)

        # ----------------------------------------------------
        # Validate inventory
        # ----------------------------------------------------
        - bash: |
            set -e

            "$ANSIBLE_VENV/bin/ansible-inventory" \
              -i ansible/inventory.ini \
              --list \
              > "$(Agent.TempDirectory)/ansible-inventory.json"

            echo "Ansible inventory validated successfully."

          displayName: "Validate Ansible Inventory"
          env:
            ANSIBLE_VENV: $(ANSIBLE_VENV)

        # ----------------------------------------------------
        # Validate playbook syntax
        # ----------------------------------------------------
        - bash: |
            set -e

            "$ANSIBLE_VENV/bin/ansible-playbook" \
              ansible/site.yml \
              -i ansible/inventory.ini \
              --syntax-check

          displayName: "Ansible Syntax Check"
          env:
            ANSIBLE_VENV: $(ANSIBLE_VENV)

        # ----------------------------------------------------
        # Download SSH key
        # ----------------------------------------------------
        - task: DownloadSecureFile@1
          name: downloadSSHKey
          displayName: "Download Secure SSH Key"
          inputs:
            secureFile: "id_ed25519"

        # ----------------------------------------------------
        # Prepare SSH key
        # ----------------------------------------------------
        - bash: |
            set -e

            SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

            chmod 600 "$SSH_KEY_PATH"

            echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"

          displayName: "Prepare Secure SSH Key"

        # ----------------------------------------------------
        # Test SSH connectivity
        # ----------------------------------------------------
        - bash: |
            set -e

            echo "Testing SSH connectivity to all Ansible hosts..."

            "$ANSIBLE_VENV/bin/ansible" \
              -i ansible/inventory.ini \
              all \
              -m ping \
              --private-key "$SSH_KEY_PATH"

          displayName: "Test SSH Connectivity"
          env:
            ANSIBLE_VENV: $(ANSIBLE_VENV)
            SSH_KEY_PATH: $(SSH_KEY_PATH)


# ============================================================
# STAGE 3: CONFIGURE AND DEPLOY
# ============================================================
- stage: ConfigureAndDeploy
  displayName: "3. Configure and Deploy"

  dependsOn: Validate

  condition: succeeded()

  jobs:

    - job: DeployEpicBook
      displayName: "Configure Servers and Deploy EpicBook"

      pool:
        name: "epicbook-agent-pool"

      steps:

        - checkout: self
          displayName: "Checkout Repository"

        # ----------------------------------------------------
        # Install Python tooling
        # ----------------------------------------------------
        - bash: |
            set -e

            sudo apt-get update
            sudo apt-get install -y python3-pip python3-venv

          displayName: "Install Python Tooling"

        # ----------------------------------------------------
        # Create Ansible virtual environment
        # ----------------------------------------------------
        - bash: |
            set -e

            VENV_PATH="$(Agent.TempDirectory)/epicbook-ansible-venv"

            rm -rf "$VENV_PATH"

            python3 -m venv "$VENV_PATH"

            "$VENV_PATH/bin/python" -m pip install --upgrade pip
            "$VENV_PATH/bin/pip" install ansible

            "$VENV_PATH/bin/ansible" --version

            echo "##vso[task.setvariable variable=ANSIBLE_VENV]$VENV_PATH"

          displayName: "Install Ansible"

        # ----------------------------------------------------
        # Install MySQL collection
        # ----------------------------------------------------
        - bash: |
            set -e

            "$ANSIBLE_VENV/bin/ansible-galaxy" \
              collection install community.mysql

          displayName: "Install Ansible MySQL Collection"
          env:
            ANSIBLE_VENV: $(ANSIBLE_VENV)

        # ----------------------------------------------------
        # Download SSH private key
        # ----------------------------------------------------
        - task: DownloadSecureFile@1
          name: downloadSSHKey
          displayName: "Download Secure SSH Key"
          inputs:
            secureFile: "id_ed25519"

        # ----------------------------------------------------
        # Prepare SSH key
        # ----------------------------------------------------
        - bash: |
            set -e

            SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

            chmod 600 "$SSH_KEY_PATH"

            echo "SSH key prepared successfully."

            echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"

          displayName: "Prepare Secure SSH Key"

        # ----------------------------------------------------
        # Run Ansible deployment
        # ----------------------------------------------------
        - bash: |
            set -e

            echo "Starting EpicBook deployment..."

            "$ANSIBLE_VENV/bin/ansible-playbook" \
              -i ansible/inventory.ini \
              ansible/site.yml \
              --private-key "$SSH_KEY_PATH" \
              -e "db_admin_username=$DB_ADMIN_USERNAME" \
              -e "db_admin_password=$DB_ADMIN_PASSWORD"

            echo "EpicBook deployment completed successfully."

          displayName: "Deploy EpicBook with Ansible"

          env:
            ANSIBLE_VENV: $(ANSIBLE_VENV)
            SSH_KEY_PATH: $(SSH_KEY_PATH)

            DB_ADMIN_USERNAME: $(mysqlAdminUsername)
            DB_ADMIN_PASSWORD: $(mysqlAdminPassword)


# ============================================================
# STAGE 4: VERIFY
# ============================================================
- stage: Verify
  displayName: "4. Verify"

  dependsOn: ConfigureAndDeploy

  condition: succeeded()

  jobs:

    - job: VerifyDeployment
      displayName: "Verify EpicBook Deployment"

      pool:
        name: "epicbook-agent-pool"

      steps:

        - checkout: self
          displayName: "Checkout Repository"

        # ----------------------------------------------------
        # Deployment summary
        # ----------------------------------------------------
        - bash: |
            set -e

            echo ""
            echo "=================================================="
            echo "EpicBook Deployment Verification"
            echo "=================================================="
            echo ""

            echo "Deployment stage completed successfully."
            echo "Ansible exited with status: 0"
            echo "Unreachable hosts: 0"
            echo "Failed hosts: 0"

            echo ""
            echo "Frontend URL:"
            echo "http://34.237.145.113"

            echo ""
            echo "=================================================="
            echo "EpicBook deployment verification completed."
            echo "=================================================="

          displayName: "Verify Deployment Result"