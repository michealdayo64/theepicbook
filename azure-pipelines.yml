trigger:
  branches:
    include:
      - main

  paths:
    include:
      - routes/**
      - models/**
      - views/**
      - public/**
      - config/**
      - db/**
      - ansible/**
      - server.js
      - package.json
      - package-lock.json
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main

pool:
  name: "epicbook-agent-pool"

variables:
  - group: "Epicbook-mysql-secrets"

  - name: ANSIBLE_VENV
    value: "$(Agent.TempDirectory)/epicbook-ansible-venv"

  - name: ANSIBLE_HOST_KEY_CHECKING
    value: "False"


# ============================================================
# STAGE 1: PREPARE
# ============================================================

stages:

- stage: Prepare
  displayName: "1. Prepare"

  jobs:
  - job: PrepareEnvironment
    displayName: "Prepare Ansible Environment"

    steps:

    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Install Python / pip / venv
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Installing Python tooling..."

        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv openssh-client

        echo "Python version:"
        python3 --version

        echo "pip version:"
        python3 -m pip --version

      displayName: "Install Python Tooling"


    # --------------------------------------------------------
    # Create Ansible virtual environment
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Creating Ansible virtual environment..."

        rm -rf "$(ANSIBLE_VENV)"

        python3 -m venv "$(ANSIBLE_VENV)"

        "$(ANSIBLE_VENV)/bin/python" -m pip install --upgrade pip

        "$(ANSIBLE_VENV)/bin/pip" install ansible

        echo "Ansible version:"
        "$(ANSIBLE_VENV)/bin/ansible" --version

      displayName: "Create Ansible Environment"


    # --------------------------------------------------------
    # Install required Ansible collection
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Installing Ansible collections..."

        "$(ANSIBLE_VENV)/bin/ansible-galaxy" collection install community.mysql

      displayName: "Install Ansible Collections"


    # --------------------------------------------------------
    # Download SSH private key securely
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download SSH Private Key"
      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Prepare key
    # --------------------------------------------------------

    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

        chmod 600 "$SSH_KEY_PATH"

        echo "SSH private key prepared."

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"

      displayName: "Prepare Secure SSH Key"


# ============================================================
# STAGE 2: VALIDATE
# ============================================================

- stage: Validate
  displayName: "2. Validate"

  dependsOn: Prepare

  jobs:
  - job: ValidateAnsible
    displayName: "Validate Ansible Configuration"

    steps:

    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Install Python tooling
    # --------------------------------------------------------

    - bash: |
        set -e

        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv openssh-client netcat-openbsd

        rm -rf "$(ANSIBLE_VENV)"

        python3 -m venv "$(ANSIBLE_VENV)"

        "$(ANSIBLE_VENV)/bin/python" -m pip install --upgrade pip

        "$(ANSIBLE_VENV)/bin/pip" install ansible

        "$(ANSIBLE_VENV)/bin/ansible-galaxy" \
          collection install community.mysql

      displayName: "Prepare Ansible Environment"


    # --------------------------------------------------------
    # Validate inventory
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Validating Ansible inventory..."

        "$(ANSIBLE_VENV)/bin/ansible-inventory" \
          -i ansible/inventory.ini \
          --list

      displayName: "Validate Inventory"


    # --------------------------------------------------------
    # Validate playbook syntax
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Checking Ansible playbook syntax..."

        "$(ANSIBLE_VENV)/bin/ansible-playbook" \
          -i ansible/inventory.ini \
          ansible/site.yml \
          --syntax-check

      displayName: "Ansible Syntax Check"


    # --------------------------------------------------------
    # Download SSH key
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download SSH Private Key"
      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Configure SSH
    #
    # Frontend:
    #
    # Azure DevOps Agent
    #        |
    #        | SSH
    #        v
    # 34.237.145.113
    #
    # Backend:
    #
    # Azure DevOps Agent
    #        |
    #        | SSH ProxyCommand
    #        v
    # Frontend
    #        |
    #        | SSH
    #        v
    # 10.0.2.157
    # --------------------------------------------------------

    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"
        chmod 600 "$SSH_KEY_PATH"

        SSH_CONFIG="$(Agent.TempDirectory)/epicbook_ssh_config"

        cat > "$SSH_CONFIG" <<EOF
        Host epicbook-frontend
          HostName 34.237.145.113
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          IdentitiesOnly yes
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null

        Host epicbook-backend
          HostName 10.0.2.157
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          IdentitiesOnly yes
          ProxyCommand ssh -i $SSH_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ubuntu@34.237.145.113
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

        chmod 600 "$SSH_CONFIG"

        echo "SSH configuration created."

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"
        echo "##vso[task.setvariable variable=SSH_CONFIG]$SSH_CONFIG"

      displayName: "Configure SSH Jump Host"


    # --------------------------------------------------------
    # Test frontend SSH
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Testing SSH connectivity to frontend..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-frontend \
          "echo 'Frontend SSH: SUCCESS'"

      displayName: "Test Frontend SSH"
      env:
        SSH_CONFIG: $(SSH_CONFIG)


    # --------------------------------------------------------
    # Test backend SSH through frontend
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Testing backend connectivity through frontend..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-backend \
          "echo 'Backend SSH through frontend: SUCCESS'"

      displayName: "Test Backend SSH Through Frontend"
      env:
        SSH_CONFIG: $(SSH_CONFIG)


    # --------------------------------------------------------
    # Test Ansible connectivity
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Testing Ansible connectivity to all hosts..."

        "$(ANSIBLE_VENV)/bin/ansible" \
          -i ansible/inventory.ini \
          all \
          -m ping \
          --private-key "$(SSH_KEY_PATH)" \
          --ssh-common-args="-F $(SSH_CONFIG)"

      displayName: "Ansible Connectivity Test"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)
        SSH_KEY_PATH: $(SSH_KEY_PATH)
        SSH_CONFIG: $(SSH_CONFIG)
        ANSIBLE_HOST_KEY_CHECKING: "False"


# ============================================================
# STAGE 3: CONFIGURE AND DEPLOY
# ============================================================

- stage: ConfigureAndDeploy
  displayName: "3. Configure and Deploy"

  dependsOn: Validate

  jobs:
  - job: DeployEpicBook
    displayName: "Configure Servers and Deploy EpicBook"

    steps:

    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Prepare Ansible
    # --------------------------------------------------------

    - bash: |
        set -e

        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv openssh-client

        rm -rf "$(ANSIBLE_VENV)"

        python3 -m venv "$(ANSIBLE_VENV)"

        "$(ANSIBLE_VENV)/bin/python" -m pip install --upgrade pip

        "$(ANSIBLE_VENV)/bin/pip" install ansible

        "$(ANSIBLE_VENV)/bin/ansible-galaxy" \
          collection install community.mysql

      displayName: "Prepare Ansible Environment"


    # --------------------------------------------------------
    # Download SSH private key
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download SSH Private Key"
      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Configure SSH jump
    # --------------------------------------------------------

    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

        chmod 600 "$SSH_KEY_PATH"

        SSH_CONFIG="$(Agent.TempDirectory)/epicbook_ssh_config"

        cat > "$SSH_CONFIG" <<EOF
        Host epicbook-frontend
          HostName 34.237.145.113
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          IdentitiesOnly yes
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null

        Host epicbook-backend
          HostName 10.0.2.157
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          IdentitiesOnly yes
          ProxyCommand ssh -i $SSH_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ubuntu@34.237.145.113
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

        chmod 600 "$SSH_CONFIG"

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"
        echo "##vso[task.setvariable variable=SSH_CONFIG]$SSH_CONFIG"

      displayName: "Configure SSH Jump Host"


    # --------------------------------------------------------
    # Verify SSH before deployment
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Verifying frontend SSH..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-frontend \
          "echo 'Frontend SSH: SUCCESS'"

        echo "Verifying backend SSH through frontend..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-backend \
          "echo 'Backend SSH through frontend: SUCCESS'"

      displayName: "Verify SSH Connectivity"

      env:
        SSH_CONFIG: $(SSH_CONFIG)


    # --------------------------------------------------------
    # Run Ansible deployment
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Starting EpicBook deployment..."

        "$(ANSIBLE_VENV)/bin/ansible-playbook" \
          -i ansible/inventory.ini \
          ansible/site.yml \
          --private-key "$(SSH_KEY_PATH)" \
          --ssh-common-args="-F $(SSH_CONFIG)" \
          -e "db_admin_username=$(mysqlAdminUsername)" \
          -e "db_admin_password=$(mysqlAdminPassword)" \
          -e "ssh_config_path=$(SSH_CONFIG)"

      displayName: "Run Ansible Deployment"

      env:
        ANSIBLE_VENV: $(ANSIBLE_VENV)
        SSH_KEY_PATH: $(SSH_KEY_PATH)
        SSH_CONFIG: $(SSH_CONFIG)
        ANSIBLE_HOST_KEY_CHECKING: "False"


# ============================================================
# STAGE 4: VERIFY
# ============================================================

- stage: Verify
  displayName: "4. Verify"

  dependsOn: ConfigureAndDeploy

  condition: succeeded()

  jobs:
  - job: VerifyDeployment
    displayName: "Verify EpicBook Deployment"

    steps:

    - checkout: self
      displayName: "Checkout Repository"


    # --------------------------------------------------------
    # Prepare SSH
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: downloadSSHKey
      displayName: "Download SSH Private Key"
      inputs:
        secureFile: "id_ed25519"


    # --------------------------------------------------------
    # Create SSH configuration
    # --------------------------------------------------------

    - bash: |
        set -e

        SSH_KEY_PATH="$(downloadSSHKey.secureFilePath)"

        chmod 600 "$SSH_KEY_PATH"

        SSH_CONFIG="$(Agent.TempDirectory)/epicbook_ssh_config"

        cat > "$SSH_CONFIG" <<EOF
        Host epicbook-frontend
          HostName 34.237.145.113
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          IdentitiesOnly yes
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null

        Host epicbook-backend
          HostName 10.0.2.157
          User ubuntu
          IdentityFile $SSH_KEY_PATH
          IdentitiesOnly yes
          ProxyCommand ssh -i $SSH_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ubuntu@34.237.145.113
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

        chmod 600 "$SSH_CONFIG"

        echo "##vso[task.setvariable variable=SSH_KEY_PATH]$SSH_KEY_PATH"
        echo "##vso[task.setvariable variable=SSH_CONFIG]$SSH_CONFIG"

      displayName: "Configure SSH"


    # --------------------------------------------------------
    # Verify frontend
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Checking frontend server..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-frontend \
          "hostname && systemctl is-active nginx"

      displayName: "Verify Frontend"


    # --------------------------------------------------------
    # Verify backend
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Checking backend server..."

        ssh \
          -F "$(SSH_CONFIG)" \
          epicbook-backend \
          "hostname"

      displayName: "Verify Backend"


    # --------------------------------------------------------
    # Verify application through frontend
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "Checking EpicBook application..."

        HTTP_STATUS=$(curl \
          -s \
          -o /dev/null \
          -w "%{http_code}" \
          --connect-timeout 10 \
          http://34.237.145.113)

        echo "EpicBook HTTP status: $HTTP_STATUS"

        if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
          echo "EpicBook application is reachable."
        else
          echo "EpicBook application verification failed."

          exit 1
        fi

      displayName: "Verify EpicBook HTTP"